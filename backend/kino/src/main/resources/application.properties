spring.application.name=kino
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# DEV defaults (override via environment variables)
security.jwt.secret=change-me-change-me-change-me-change-me
security.jwt.expiration-seconds=86400

omdb.base-url=https://www.omdbapi.com/
omdb.api-key=${OMDB_API_KEY:}